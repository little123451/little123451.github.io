<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>火箭队模拟器 · 第一世代</title>
    <meta name="description" content="火箭队模拟器：扮演年轻的大木博士，替火箭队管理与运营抢来的宝可梦，同时为日后的宝可梦图鉴积累研究数据。集齐 151 只图鉴即胜利。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">🚀</div>
          <div class="brand-text">
            <h1>火箭队模拟器</h1>
            <p>第一世代 · 大木博士的暗面档案</p>
          </div>
        </div>

        <div class="stats">
          <div class="stat gold"><span class="ico">🪙</span><b id="gold">0</b><label>资金</label></div>
          <div class="stat berry"><span class="ico">🍒</span><b id="berries">0</b><label>树果</label></div>
          <div class="stat rep"><span class="ico">⭐</span><b id="rep">0</b><label>声望</label></div>
          <div class="stat dex" data-act="open-dex" role="button" tabindex="0">
            <span class="ico">📖</span><b id="dex">0/151</b><label>图鉴</label>
          </div>
        </div>

        <div class="clock">
          <div class="day">第 <b id="day">1</b> 天</div>
          <div class="speeds" id="speeds">
            <button data-act="speed" data-speed="0" title="暂停">⏸</button>
            <button data-act="speed" data-speed="1" class="on">1×</button>
            <button data-act="speed" data-speed="2">2×</button>
            <button data-act="speed" data-speed="3">3×</button>
          </div>
          <div class="menu">
            <button data-act="open-help" class="ghost">玩法</button>
            <button data-act="save" class="ghost">保存</button>
            <button data-act="reset" class="ghost danger">重开</button>
          </div>
        </div>
      </header>

      <div id="win-banner" class="win-banner hidden">🏆 图鉴完成：151 只全部记录 · 大木博士的暗面档案已补全</div>

      <main class="layout">
        <section class="panel pens-panel">
          <div class="panel-head">
            <h2>培育栏</h2>
            <span class="hint" id="pen-hint"></span>
            <button class="mini" data-act="add-pen">扩建 +</button>
          </div>
          <div id="pens" class="pens"></div>

          <div class="panel-head eggs-head">
            <h2>孵化器</h2>
            <span class="hint" id="egg-hint"></span>
          </div>
          <div id="eggs" class="eggs"></div>

          <div class="panel-head eggs-head">
            <h2>实验室</h2>
            <span class="hint" id="lab-hint"></span>
          </div>
          <div id="lab" class="lab"></div>
        </section>

        <aside class="side">
          <section class="panel">
            <div class="panel-head">
              <h2>部门需求</h2>
              <span class="hint" id="order-hint"></span>
            </div>
            <div id="orders" class="orders"></div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>市场</h2><span class="hint" id="market-hint"></span></div>
            <div id="shop" class="shop"></div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>设施</h2></div>
            <div id="upgrades" class="upgrades"></div>
          </section>
        </aside>
      </main>

      <footer class="logbar">
        <div class="log-title">日志</div>
        <div id="log" class="log"></div>
      </footer>
    </div>

    <div id="modal" class="modal hidden" aria-hidden="true"></div>
    <div id="toast" class="toast"></div>

    <script type="module" src="js/main.mjs"></script>
  </body>
</html>
